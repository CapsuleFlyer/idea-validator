# Copy to k8s/secrets.yaml (git-ignored), put real values in, then: kubectl apply -f k8s/secrets.yaml
# Never commit real values. Jenkins gets the kubeconfig as a Jenkins credential, not from this repo.
apiVersion: v1
kind: Secret
metadata: { name: app-secrets, namespace: idea-validator }
type: Opaque
stringData:
  postgres-password: change-me
  github-token: ""
  hosted-model-api-key: ""
